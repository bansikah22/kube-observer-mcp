apiVersion: v1
kind: Namespace
metadata:
  name: kube-observer-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-observer-mcp
  namespace: kube-observer-mcp
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-observer-mcp
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-observer-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-observer-mcp
subjects:
  - kind: ServiceAccount
    name: kube-observer-mcp
    namespace: kube-observer-mcp
