apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-observer-mcp
  namespace: kube-observer-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-observer-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-observer-mcp
    spec:
      serviceAccountName: kube-observer-mcp
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      containers:
        - name: server
          image: ghcr.io/bansikah22/kube-observer-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: kube-observer-mcp
  namespace: kube-observer-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-observer-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
