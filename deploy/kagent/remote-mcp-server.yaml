apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kube-observer-mcp
  namespace: kagent
spec:
  description: Read-only, concise Kubernetes node and pod inventory tools.
  protocol: STREAMABLE_HTTP
  timeout: 20s
  url: http://kube-observer-mcp.kube-observer-mcp.svc.cluster.local:8000/mcp
